name: Deploy to UATD

on:
  pull_request:
    branches:
      - uat
  workflow_dispatch: 

jobs:
  deploy-uatd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
        with:
          default-config-file-path: config/config.toml

      - name: Deploy all SQL files to UATD
        env:
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_USER: ${{ secrets.UATD_SF_USER }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_PASSWORD: ${{ secrets.UATD_SF_PASSWORD }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_ACCOUNT: ${{ secrets.UATD_SF_ACCOUNT }}
        run: |
          for file in $(ls ./sql/*.sql | sort); do
            echo "Executing $file..."
            snow sql -f "$file"
          done