  name: Deploy to UATD

  on:
    # pull_request:
    #   branches:
    #     - develop
    # workflow_dispatch: 
    workflow_dispatch:
      inputs:
        project:
          description: 'Project to deploy'
          required: true
          type: choice
          options:
            - project-a
            - project-b
        environment:
          description: 'Target environment'
          required: true
          type: choice
          options:
            - uatd
            - uat
            - prod
  env:
  # Define allowed users per environment
    UATD_USERS: sudipta1976
    UAT_USERS: sudipta1976
    PROD_USERS: sudipta1976

  jobs:
    deploy-project-a:
      if: ${{ github.event.inputs.project == 'project-a' }}
      runs-on: ubuntu-latest
      
      steps:
        - name: Validate user permissions
          run: |
            echo "Actor: ${{ github.actor }}"
            case "${{ github.event.inputs.environment }}" in
              uatd)
                [[ " $UATD_USERS " =~ " ${{ github.actor }} " ]] || {
                  echo "❌ User ${{ github.actor }} is not allowed to deploy to UATD."
                  exit 1
                }
                ;;
              uat)
                [[ " $UAT_USERS " =~ " ${{ github.actor }} " ]] || {
                  echo "❌ User ${{ github.actor }} is not allowed to deploy to UAT."
                  exit 1
                }
                ;;
              prod)
                [[ " $PROD_USERS " =~ " ${{ github.actor }} " ]] || {
                  echo "❌ User ${{ github.actor }} is not allowed to deploy to PROD."
                  exit 1
                }
                ;;
            esac
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Install Snowflake CLI
          uses: snowflakedb/snowflake-cli-action@v1.5
          with:
            default-config-file-path: config/config.toml

        - name: Set environment variables
          run: |
            echo "PROJECT=${{ github.event.inputs.project }}" >> $GITHUB_ENV
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV

        - name: Deploy all SQL files to UATD
          env:
            SNOWFLAKE_CONNECTIONS_MYCONNECTION_USER: ${{ secrets.UATD_SF_USER }}
            SNOWFLAKE_CONNECTIONS_MYCONNECTION_PASSWORD: ${{ secrets.UATD_SF_PASSWORD }}
            SNOWFLAKE_CONNECTIONS_MYCONNECTION_ACCOUNT: ${{ secrets.UATD_SF_ACCOUNT }}
          run: |
            echo "Github actor ${{ github.actor }}"
            echo "Deploying Python files from ./${PROJECT}/${ENVIRONMENT}/snowpark/"
            # snow sql -q "PUT 'file:///Users/ssarkar/Documents/Projects/snowflake-cicd/project-a/uatd/snowpark/user_proc.py' @~/code_stage AUTO_COMPRESS=FALSE;"
            echo "Deploying SQL files from ./${PROJECT}/${ENVIRONMENT}/sql/"
            for file in $(ls ./${PROJECT}/${ENVIRONMENT}/sql/*.sql | sort); do
              echo "Executing $file..."
              snow sql -f "$file"
            done

    

    deploy-project-b:
      if: ${{ github.event.inputs.project == 'project-b' }}
      runs-on: ubuntu-latest
      
      steps:
        - name: Validate user permissions
          run: |
