name: Deploy to UATD

on:
  # pull_request:
  #   branches:
  #     - develop
  # workflow_dispatch: 
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to deploy'
        required: true
        type: choice
        options:
          - project-a
          - project-b

jobs:
  deploy-project-a:
    if: ${{ github.event.inputs.project == 'project-a' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
        with:
          default-config-file-path: config/config.toml

      - name: Deploy all SQL files to UATD
        env:
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_USER: ${{ secrets.UATD_SF_USER }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_PASSWORD: ${{ secrets.UATD_SF_PASSWORD }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_ACCOUNT: ${{ secrets.UATD_SF_ACCOUNT }}
        run: |
          for file in $(ls ./project-a/sql/*.sql | sort); do
            echo "Executing $file..."
            snow sql -f "$file"
          done

  deploy-project-b:
    if: ${{ github.event.inputs.project == 'project-b' }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v1.5
        with:
          default-config-file-path: config/config.toml

      - name: Deploy all SQL files to UATD
        env:
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_USER: ${{ secrets.UATD_SF_USER }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_PASSWORD: ${{ secrets.UATD_SF_PASSWORD }}
          SNOWFLAKE_CONNECTIONS_MYCONNECTION_ACCOUNT: ${{ secrets.UATD_SF_ACCOUNT }}
        run: |
          for file in $(ls ./project-b/sql/*.sql | sort); do
            echo "Executing $file..."
            snow sql -f "$file"
          done
  
