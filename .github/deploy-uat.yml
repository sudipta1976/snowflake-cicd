name: Deploy to UAT
on:
  pull_request:
    branches:
      - uat
jobs:
  deploy-uat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: snowflakedb/snowflake-cli-action@v1.5
      - name: Deploy SQL to UAT
        env:
          SNOWFLAKE_USER: ${{ secrets.UAT_SF_USER }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.UAT_SF_ACCOUNT }}
          SNOWFLAKE_PRIVATE_KEY_RAW: ${{ secrets.UAT_SF_PRIVATE_KEY_RAW }}
          PRIVATE_KEY_PASSPHRASE: ${{ secrets.UAT_SF_PASSPHRASE }}
        run: |
          snow sql -f ./sql/ddl.sql
          snow sql -f ./sql/functions.sql
          snow sql -f ./sql/tasks.sql
